name: Playwright Sharded Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    name: Run Shards
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Define how many machines you want to split your tests across.
        # Example: [1, 2, 3, 4] means 4 parallel machines.
        shardIndex: [1, 2, 3,4]
        shardTotal: [4]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18 # or your preferred version
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Playwright dynamically extracts the index and total from the matrix variables
    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    # Upload the interim blob report from this machine.
    # Note: 'path: blob-report' is Playwright's default directory for the 'blob' reporter.
    - name: Upload blob report to GitHub Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1

  merge-reports:
    name: Merge Reports
    if: ${{ !cancelled() }}
    needs: playwright-tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    # Downloads all chunks from the previous matrix jobs into a single directory
    - name: Download all shards blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    # Native Playwright command to combine all individual blobs into one final HTML package
    - name: Merge Reports
      run: npx playwright merge-reports ./all-blob-reports --reporter html

    # Uploads the unified summary report so your team can view the results
    - name: Upload Final HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: html-report
        path: playwright-report
        retention-days: 7
